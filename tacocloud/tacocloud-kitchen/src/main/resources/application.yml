server:
  port: 8081

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-none}]"

tacocloud:
  messaging:
    jms:
      destination: ${TACOCLOUD_JMS_DESTINATION:tacocloud.order.queue}
    rabbit:
      destination: ${TACOCLOUD_RABBIT_DESTINATION:tacocloud.order.queue}
      dead-letter-exchange: ${TACOCLOUD_RABBIT_DLX:tacocloud.order.dlx}
      dead-letter-routing-key: ${TACOCLOUD_RABBIT_DLQ_ROUTING_KEY:tacocloud.order.dead}
      dead-letter-queue: ${TACOCLOUD_RABBIT_DLQ:tacocloud.order.queue.dlq}
    kafka:
      topic: ${TACOCLOUD_KAFKA_TOPIC:tacocloud.orders.topic}
  kitchen:
    api-base-url: ${TACOCLOUD_API_URL:http://localhost:8080}
    username: ${TACOCLOUD_KITCHEN_USERNAME:kitchen}
    password: ${TACOCLOUD_KITCHEN_PASSWORD:}
    consumer:
      max-attempts: ${TACOCLOUD_CONSUMER_MAX_ATTEMPTS:3}
      backoff: ${TACOCLOUD_CONSUMER_BACKOFF:1s}
      concurrency: ${TACOCLOUD_CONSUMER_CONCURRENCY:1}

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/tacocloud?replicaSet=rs0}
      auto-index-creation: true
  artemis:
    host: ${ARTEMIS_HOST:localhost}
    port: ${ARTEMIS_PORT:61616}
    user: ${ARTEMIS_USERNAME:guest}
    password: ${ARTEMIS_PASSWORD:guest}
    embedded:
      enabled: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: tacocloud_kitchen
      properties:
        spring.json.trusted.packages: tacos.messaging
  jms:
    template:
      receive-timeout: 2

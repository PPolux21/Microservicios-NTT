# tag::springBootAdminCreds[]
# tag::springBootAdminUri[]
spring:
# end::springBootAdminUri[]
# end::springBootAdminCreds[]
  application:
    name: taco-cloud
  artemis:
    host: ${ARTEMIS_HOST:localhost}
    port: ${ARTEMIS_PORT:61616}
    user: ${ARTEMIS_USERNAME:guest}
    password: ${ARTEMIS_PASSWORD:guest}
    embedded:
      enabled: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
  data:
    rest:
      base-path: /data-api
    cassandra:
      keyspace-name: tacocloud
      schema-action: recreate
# tag::springBootAdminCreds[]
# tag::springBootAdminUri[]
  boot:
    admin:
      client:
        url: http://localhost:9090
# end::springBootAdminUri[]
        username: admin
        password: 53cr3t
# end::springBootAdminCreds[]

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      keySerializer: org.springframework.kafka.support.serializer.JsonSerializer
      valueSerializer: org.springframework.kafka.support.serializer.JsonSerializer
  jmx:
    enabled: true
  mongodb:
      auto-index-creation: true

#tag::exposeAll[]
#tag::excludeSome[]
#tag::healthShowDetails[]
#tag::infoGitModeFull[]
tacocloud:
  messaging:
    jms:
      destination: ${TACOCLOUD_JMS_DESTINATION:tacocloud.order.queue}
    rabbit:
      destination: ${TACOCLOUD_RABBIT_DESTINATION:tacocloud.order.queue}
    kafka:
      topic: ${TACOCLOUD_KAFKA_TOPIC:tacocloud.orders.topic}
  cors:
    allowed-origins: http://localhost:4200
  orders:
    max-quantity: 10
  kitchen:
    station-id: ${TACOCLOUD_KITCHEN_STATION_ID:station-01}
    eta:
      base-minutes: ${TACOCLOUD_KITCHEN_ETA_BASE:2}
      minutes-per-queued-order: ${TACOCLOUD_KITCHEN_ETA_PER_QUEUED_ORDER:3}
      minutes-per-item: ${TACOCLOUD_KITCHEN_ETA_PER_ITEM:2}
      minutes-per-complexity-point: ${TACOCLOUD_KITCHEN_ETA_PER_COMPLEXITY:1}
  design-rules:
    allow-extreme-spice: false
    vegan-only: false
  search:
    max-page-size: 50
  recommendation:
    zone: America/Mexico_City
  rating:
    min-votes: 3
    max-top-limit: 50
  coupons:
    rules:
      PROMO10:
        type: PERCENTAGE
        value: 10
        valid-from: 2026-01-01
        valid-until: 2027-12-31
        minimum-purchase: 100.00
        max-discount: 200.00
      SAVE50:
        type: FIXED
        value: 50.00
        valid-from: 2026-01-01
        valid-until: 2027-12-31
        minimum-purchase: 50.00

management:
#end::infoGitModeFull[]
#end::healthShowDetails[]
  endpoints:
    web:
      exposure:
        include: '*'
#end::exposeAll[]
        exclude: threaddump,heapdump
#end::excludeSome[]
#tag::healthShowDetails[]
  endpoint:
    health:
      show-details: always
#end::healthShowDetails[]
#tag::infoGitModeFull[]
  info:
    git:
      mode: full
#end::infoGitModeFull[]

#tag::contactInfo[]
info:
  contact:
    email: support@tacocloud.com
    phone: 822-625-6831
#end::contactInfo[]

